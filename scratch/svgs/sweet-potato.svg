
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <ellipse cx="512" cy="760" rx="230" ry="24" fill="#2B2620" opacity="0.12"/>
  
      <g transform="translate(512, 480)">
        <!-- Main body -->
        <g transform="translate(40, -20) rotate(-8)">
          <path d="M -160,-170 C -40,-220 120,-190 180,-80 C 230,20 200,160 110,210 C 20,250 -120,220 -180,130 C -230,40 -220,-80 -160,-170 Z"
                fill="#C4573B" stroke="#E87D38" stroke-width="3.5" stroke-linejoin="round"/>
          <!-- Tonal gouache shadow & wash -->
          <path d="M -140,-130 C -40,-180 80,-160 140,-70 C 180,10 160,120 90,170 C 50,110 -20,40 -80,-40 C -120,-90 -140,-130 -140,-130 Z"
                fill="#FFF" opacity="0.18"/>
          <!-- Stem or calyx -->
          <path d="M -10,-205 C 5,-240 -15,-270 -8,-285 C 2,-285 20,-260 12,-205 Z" fill="#4D6B28" stroke="#2D4214" stroke-width="2.5"/>
          <!-- Botanical skin marks/dots -->
          <circle cx="-70" cy="50" r="3.5" fill="#E87D38" opacity="0.7"/>
          <circle cx="80" cy="-20" r="4" fill="#E87D38" opacity="0.7"/>
          <circle cx="40" cy="110" r="3.5" fill="#E87D38" opacity="0.7"/>
        </g>
        <!-- Cut halved section -->
        <g transform="translate(-130, 90) rotate(12)">
          <ellipse cx="0" cy="0" rx="140" ry="115" fill="#E87D38" stroke="#2B1A0E" stroke-width="3"/>
          <ellipse cx="-5" cy="-2" rx="122" ry="98" fill="#E87D38" stroke="#C4573B" stroke-width="2.5"/>
          <!-- Core / internal rings -->
          <ellipse cx="-5" cy="-2" rx="80" ry="60" fill="none" stroke="#C4573B" stroke-width="2" stroke-dasharray="6,4" opacity="0.6"/>
          <ellipse cx="-5" cy="-2" rx="40" ry="28" fill="#C4573B" opacity="0.3"/>
          <!-- Gouache sheen -->
          <path d="M -50,-50 Q -10,-70 40,-45" stroke="#FFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>
        </g>
      </g>
    
</svg>
